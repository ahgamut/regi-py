[build-system]
requires = ["setuptools>=61.0", "pybind11>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "regi_py"
dependencies = [
    "pybind11>=3",
    "numpy>=1.21",
    "python-multipart>=0.0.22",
    "fastapi>=0.116.1",
    "uvicorn>=0.23",
    "jinja2>=3.1",
    "anyio>=4.10.0",
    "msgpack>=1.0",
]
version = "0.0.1"
license = {file = "LICENSE"}
authors = [
  { name="Gautham Venkatasubramanian" },
]
description="C++ implementation of game mechanics of Regicide"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# test/dev tooling; install with `pip install -e .[dev]` (numpy is now a core dep)
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
